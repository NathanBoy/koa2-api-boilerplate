name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          set -e
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$f"
          done

      - name: Smoke test (boot + health check)
        run: |
          set -e
          PORT=3100 node server.js &
          SERVER_PID=$!
          # Poll until the server becomes healthy (booting can take a few
          # seconds while it attempts a MongoDB connection), up to 20s.
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/health >/dev/null 2>&1; then
              echo "server healthy after ${i}s"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          echo "server failed to become healthy within 20s"
          exit 1
