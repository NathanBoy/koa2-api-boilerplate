# One-command local stack: MongoDB + API service.
# Usage: docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: kok-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: kok-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/koa2_api
    ports:
      - "3000:3000"

volumes:
  mongo-data:
